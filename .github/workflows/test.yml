name: test

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  npm-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Só o `npm test` (herméticos, sem --network). test:network e test:e2e ficam fora do CI.
      - run: npm test
      # Página de cada motor no ar, com vídeo e na ordem (precisa de rede; só um motor com pagesPendente é tolerado).
      - run: npm run test:pages-live

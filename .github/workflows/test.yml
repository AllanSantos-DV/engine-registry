name: test

# Checagens leves no runner Linux hospedado, só as que precisam de rede: a página de cada motor no ar e cada produto do
# manifest na versão da última release. A suíte e o Windows ficam na checagem local antes do push, não aqui.
# Push só na main: a develop entra na main por fast-forward com o mesmo SHA, e um push em cada uma rodava o mesmo commit duas vezes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Só a PR cancela o run anterior da mesma ref: um push na main termina, para o gate da release não ser cancelado.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  live-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Página de cada motor no ar, com vídeo e na ordem (só um motor com pagesPendente é tolerado).
      - run: npm run test:pages-live
      # Cada produto do manifest na versão da última release publicada.
      - run: npm run test:versions-live
        env:
          GH_TOKEN: ${{ github.token }}

name: test

# Hospedado, só checagem estática leve: o teto de código do kit (sem rede, sem suíte). A suíte, o Windows e as checagens
# com rede (test:pages-live, test:versions-live) rodam na checagem local antes do push. Contingência de cobrança:
# docs/billing-fallback.md.
# Push só na main: a develop entra na main por fast-forward com o mesmo SHA, e um push em cada uma rodava o mesmo commit duas vezes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Só a PR cancela o run anterior da mesma ref: um push na main termina, para o gate da release não ser cancelado.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    # Pull request de fork (código de fora) não roda nada, sobretudo no runner local.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CI_RUNNER == 'local' && fromJSON('["self-hosted","Linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Limpar pastas de trabalho do runner persistente
        if: vars.CI_RUNNER == 'local'
        shell: bash
        run: find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" -mindepth 1 -delete

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Teto de código do kit
        run: node kit/budget.mjs

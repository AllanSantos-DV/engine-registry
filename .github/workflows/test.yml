name: test

# Push só na main: a develop entra na main por fast-forward com o mesmo SHA, e um push em cada uma rodava o mesmo
# commit duas vezes. A develop é coberta pelas suítes locais e, quando há PR, pelo gatilho pull_request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Só a PR cancela o run anterior da mesma ref: um push na main termina, para o gate da release não ser cancelado.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  npm-test:
    strategy:
      fail-fast: false
      matrix:
        # Windows cobra mais por minuto: só na main e na PR; dispatch em outra branch roda só no Linux.
        os: ${{ fromJSON((github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Só o `npm test` (herméticos, sem --network). test:network e test:e2e ficam fora do CI.
      - run: npm test
      # Página de cada motor no ar, com vídeo e na ordem (precisa de rede; só um motor com pagesPendente é tolerado).
      - run: npm run test:pages-live
      # Cada produto do manifest na versão da última release publicada (precisa de rede).
      - run: npm run test:versions-live
        env:
          GH_TOKEN: ${{ github.token }}

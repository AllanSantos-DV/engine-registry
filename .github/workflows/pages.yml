# Site do engine-registry (pasta site/, estático, sem build) mais o manifest.json e o schema.json da raiz: publica na branch
# gh-pages e confere a página, o manifest e o schema no ar.
# Fonte do Pages = "Deploy from a branch", gh-pages, "/": sem artefato do Actions (a cota mensal de armazenamento da conta
# bloqueia o deploy-pages). O push usa a chave de deploy PAGES_DEPLOY_KEY (push com GITHUB_TOKEN não dispara a
# publicação). Roda por disparo manual (decisão do dono) e a cada push na main que muda site/, o manifest.json ou o schema.json, para o site,
# o manifest e o schema no ar acompanharem a main; o publish republica o site inteiro da main. Processo e reversão: docs/PAGES.md.
# Runner Linux hospedado, ou o local com CI_RUNNER=local (docs/billing-fallback.md). Hospedado nunca roda teste: a conferência
# do site completo (--require-media) só roda no runner local; a suíte roda na checagem local antes do disparo.

name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'manifest.json', 'schema.json']

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ vars.CI_RUNNER == 'local' && fromJSON('["self-hosted","Linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Limpar pastas de trabalho do runner persistente
        if: vars.CI_RUNNER == 'local'
        shell: bash
        run: find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" -mindepth 1 -delete

      - name: Só a main publica (o manifest do site é o da main)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::publicar o site a partir de ${GITHUB_REF} levaria o manifest.json dessa branch ao ar; dispare o workflow na main"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Baixar o vídeo da apresentação do asset da release site-media
        run: node tools/baixar-video.mjs

      - name: Site completo, com a mídia de apresentação
        if: vars.CI_RUNNER == 'local'
        run: node tests/test-site.mjs --require-media

      - name: Publicar o site na gh-pages
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git diff --quiet "$GITHUB_SHA" origin/main -- site manifest.json schema.json || {
            echo "::error::a main mudou site/, manifest.json ou schema.json depois do commit desta execução; dispare de novo"
            exit 1
          }
          node tools/pages-branch.mjs publish --message "Site engine-registry ${GITHUB_SHA::7}"

      - name: A página no ar serve este site, o manifest.json e o schema.json do repositório
        run: node tools/pages-branch.mjs verify --stamp "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
